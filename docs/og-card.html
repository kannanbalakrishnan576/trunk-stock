<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What goes in the trunk: link preview card</title>
<!-- Source for docs/og-image.png. Render at 1200x628, device scale 2:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,628 --screenshot=docs/og-image.png docs/og-card.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500&display=swap">
<style>
  :root{--band:#14213D;--band-2:#1D2E52;--pick:#E0601A;--pick-text:#FFFFFF;--ink-2:#D5DCEA;--muted:#A9B4CB;
    --van-body:#F6F3EC;--van-glass:#9FB6D6;--van-inside:#E2D8C6;--van-wheel:#0A1222;--van-box:#C9C0AE}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:628px;overflow:hidden}
  body{background:radial-gradient(120% 140% at 100% 0%,var(--band-2) 0%,var(--band) 62%);color:#fff;
    font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;grid-template-columns:1fr 470px;
    align-items:center;gap:20px;padding:0 64px 22px 72px;position:relative}
  body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;
    background:repeating-linear-gradient(135deg,var(--pick) 0 26px,var(--band) 26px 52px)}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:92px;line-height:.95;letter-spacing:-.03em;margin-top:18px}
  h1 em{font-style:normal;color:var(--pick)}
  .hook{font-size:34px;line-height:1.3;color:var(--ink-2);margin-top:30px;max-width:16em}
  .hook b{color:#fff;font-weight:500}
  .foot{font-family:"IBM Plex Mono",monospace;font-size:19px;color:var(--muted);margin-top:34px;letter-spacing:.04em}
  svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Sample app &middot; Google TimesFM 3.0</div>
    <h1>What goes in<br>the <em>trunk</em></h1>
    <p class="hook"><b>&ldquo;No heat.&rdquo;</b> Six parts can fix it. The trunk fits three.</p>
    <p class="foot">Ranked by a time-series foundation model &middot; synthetic data</p>
  </div>
  <svg viewBox="0 0 380 210" role="img" aria-label="Service van with three of six parts highlighted">
    <ellipse cx="192" cy="196" rx="168" ry="7" fill="#000" opacity=".3"/>
    <rect x="14" y="34" width="250" height="136" rx="12" fill="var(--van-body)"/>
    <path d="M258 70H316Q330 70 338 82L362 118Q368 126 368 136V160Q368 170 358 170H258Z" fill="var(--van-body)"/>
    <path d="M272 82H314Q322 82 327 89L346 118H272Z" fill="var(--van-glass)"/>
    <path d="M264 92V160" stroke="var(--van-wheel)" stroke-opacity=".18" stroke-width="2"/>
    <rect x="276" y="128" width="16" height="4" rx="2" fill="var(--van-wheel)" opacity=".35"/>
    <rect x="14" y="140" width="354" height="9" fill="var(--pick)"/>
    <rect x="355" y="126" width="11" height="8" rx="2" fill="#FFD27A"/>
    <rect x="30" y="50" width="216" height="78" rx="6" fill="var(--van-inside)"/>
    <path d="M30 89.5H246" stroke="var(--van-wheel)" stroke-opacity=".3" stroke-width="2"/>
    <rect x="40" y="58" width="60" height="27" rx="4" fill="var(--pick)"/><path d="M61 72 l6 6 l12 -12" fill="none" stroke="var(--pick-text)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="108" y="58" width="60" height="27" rx="4" fill="var(--van-box)"/>
    <rect x="176" y="58" width="60" height="27" rx="4" fill="var(--pick)"/><path d="M197 72 l6 6 l12 -12" fill="none" stroke="var(--pick-text)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="96" width="60" height="27" rx="4" fill="var(--van-box)"/>
    <rect x="108" y="96" width="60" height="27" rx="4" fill="var(--pick)"/><path d="M129 110 l6 6 l12 -12" fill="none" stroke="var(--pick-text)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="176" y="96" width="60" height="27" rx="4" fill="var(--van-box)"/>
    <circle cx="88" cy="170" r="29" fill="var(--band)"/><circle cx="306" cy="170" r="29" fill="var(--band)"/>
    <circle cx="88" cy="170" r="23" fill="var(--van-wheel)"/><circle cx="88" cy="170" r="9" fill="var(--van-glass)"/>
    <circle cx="306" cy="170" r="23" fill="var(--van-wheel)"/><circle cx="306" cy="170" r="9" fill="var(--van-glass)"/>
  </svg>
</body>
</html>
